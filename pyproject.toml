[project]
name = "atlas"
version = "0.3.0-dev"
description = "Atlas - agente artificial persistente, offline-first e independente de fornecedor."
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "Projeto Atlas" }
]

dependencies = [
    "PyYAML>=6.0,<7.0",
]

[project.scripts]
atlas = "atlas.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-cov>=7.0", "ruff>=0.14", "mypy>=1.18"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.0",
    "ruff>=0.14",
    "mypy>=1.18",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
